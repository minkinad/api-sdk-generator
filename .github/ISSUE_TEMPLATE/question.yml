name: Usage question
description: Ask about generating, integrating, or publishing an SDK.
title: '[Question]: '
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Include the generator version and relevant command. Remove secrets and private URLs.
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What have you tried?
      description: Link the documentation you used and include any error messages.
    validations:
      required: true
