name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Setup npm with trusted publishing support
        run: npm install --global npm@11
      - name: Create release PR or publish versioned packages
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: false
          publish: pnpm run release:ci
          version: pnpm run version:packages
        env:
          GITHUB_TOKEN: ${{ github.token }}

  github-packages:
    needs: release
    if: needs.release.outputs.has-changesets == 'false'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/package-github.yml
    with:
      ref: ${{ github.sha }}
