name: Publish GitHub Packages

on:
  workflow_call:
    inputs:
      ref:
        description: Exact release commit
        required: true
        type: string
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: github-packages-core
  cancel-in-progress: false

jobs:
  publish-core:
    if: inputs.ref != '' || github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, '@minkinad/api-sdk-generator-core@')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Publish the scoped core archive
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm release:github-packages
